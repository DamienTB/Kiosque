# Chaque matin : relève les flux des journaux et publie l'application sur GitHub Pages.
name: Édition du matin

on:
  schedule:
    - cron: "15 4 * * *"     # 4 h 15 UTC = 5 h 15 à Paris en hiver, 6 h 15 en été
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Relever les journaux
        shell: pwsh
        run: ./scripts/collect.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer les articles pour la lecture hors connexion
        continue-on-error: true      # si ça échoue, l'édition est quand même publiée
        working-directory: scripts/articles
        run: |
          npm ci --no-audit --no-fund
          node extract.mjs
          rm -rf node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
